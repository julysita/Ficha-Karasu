<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE LOCK — Tabito Karasu</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ======================= RESET ======================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* ======================= VIDEO DE FONDO ======================= */
#bg-video{
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  filter:brightness(0.35) saturate(1.4) hue-rotate(180deg);
}

/* ======================= CAPA AZUL NEÓN ======================= */
#blue-layer{
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,20,50,0.6);
  backdrop-filter:blur(4px);
  z-index:-2;
}

/* ======================= PLUMAS ======================= */
.pluma{
  position:absolute;
  border-radius:50%;
  background:rgba(0,200,255,0.8);
  filter:drop-shadow(0 0 15px #00d9ff);
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-50px) rotate(0deg);}
  100%{transform:translateY(110vh) rotate(380deg);}
}

/* ======================= PANTALLA DE CARGA ======================= */
#loadingScreen{
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:#000a1a;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#00eaff;
  font-family:'Orbitron';
  letter-spacing:3px;
  font-size:2rem;
  z-index:9999;
  text-shadow:0 0 20px #00eaff;
}

#loadingBar{
  width:65%;
  height:25px;
  margin-top:30px;
  background:#001a30;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 20px #008cff;
}

#loadingProgress{
  width:0%;
  height:100%;
  background:linear-gradient(90deg, #00eaff, #006eff);
  border-radius:20px;
  box-shadow:0 0 20px #00eaff;
}

/* ======================= BOTÓN MÚSICA ======================= */
.btn-play{
  position:fixed;
  top:25px; left:25px;
  background:rgba(0,40,70,0.8);
  color:#00eaff;
  padding:12px 20px;
  border:2px solid #00eaff;
  font-family:'Orbitron';
  font-size:1rem;
  cursor:pointer;
  z-index:200;
  border-radius:10px;
  transition:0.25s;
  box-shadow:0 0 20px #00d9ff;
}
.btn-play:hover{
  background:#00eaff;
  color:#00101a;
}

/* ======================= CONTENEDOR PRINCIPAL ======================= */
.container{
  width:90%;
  max-width:1100px;
  margin:150px auto 80px;
  padding:40px;
  background:rgba(0,10,25,0.7);
  border-radius:30px;
  box-shadow:0 0 80px rgba(0,150,255,0.4);
  backdrop-filter:blur(8px);
  text-align:center;
  color:#dff8ff;
  font-family:'Chakra Petch';
}

/* ======================= IMAGEN PRINCIPAL ======================= */
.player-image{
  width:230px;
  height:230px;
  border-radius:20px;
  object-fit:cover;
  border:3px solid #00eaff;
  box-shadow:0 0 40px #00aaff;
  margin-bottom:25px;
}

/* ======================= TITULOS ======================= */
.ficha h1{
  font-size:3.3rem;
  font-family:'Orbitron';
  color:#00eaff;
  text-shadow:0 0 30px #00aaff;
}
.ficha h2{
  font-size:2.3rem;
  color:#a8eaff;
  margin-top:10px;
  text-shadow:0 0 20px #0099ff;
}

/* ======================= STATS ======================= */
.stats{
  margin-top:40px;
}
.stat{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin:18px 0;
  font-size:1.3rem;
  color:#c9f3ff;
}
.bar-container{
  width:65%;
  height:30px;
  background:#001f33;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #00bfff;
  box-shadow:0 0 20px #00bfff inset;
}
.bar-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00eaff,#006eff);
  transition:width 0.3s;
}
.stat-number{
  width:40px;
  text-align:right;
  font-family:'Orbitron';
}

/* ======================= COLUMNAS NUEVAS ======================= */
.columns{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:40px;
  margin-top:70px;
}

.column{
  background:rgba(0,25,45,0.8);
  width:370px;
  padding:25px;
  border-radius:25px;
  box-shadow:0 0 55px rgba(0,150,255,0.5);
  backdrop-filter:blur(6px);
  transition:0.25s;
  color:white;
}
.column:hover{
  transform:scale(1.03);
  box-shadow:0 0 75px #00c3ff;
}

/* Imagen arriba del texto */
.column img{
  width:100%;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 0 30px #00d9ff;
}

.column h2{
  font-size:1.8rem;
  font-family:'Orbitron';
  color:#00eaff;
  margin-bottom:20px;
  text-shadow:0 0 15px #0099ff;
}

.column p{
  white-space:pre-wrap;
  font-size:1.05rem;
  line-height:1.5;
  color:#e3faff;
}

@media(max-width:850px){
  .column{ width:90%; }
  .ficha h1{ font-size:2.5rem; }
}
</style>

</head>
<body>

<!-- VIDEO DE FONDO -->
<video id="bg-video" autoplay muted loop>
  <source src="fondo.mp4" type="video/mp4">
</video>
<div id="blue-layer"></div>

<!-- PANTALLA DE CARGA -->
<div id="loadingScreen">
  CARGANDO EL INSTINTO...
  <div id="loadingBar"><div id="loadingProgress"></div></div>
</div>

<!-- BOTÓN DE MÚSICA -->
<button class="btn-play" onclick="playAudio()">▶ / ❚❚</button>
<audio id="anthem" src="No. 1 Party Anthem.mp3"></audio>

<!-- CONTENEDOR -->
<div class="container">

  <img src="imagen1.png" class="player-image">

  <div class="ficha">
    <h1>BLUE LOCK PROJECT</h1>
    <h2>Tabito Karasu</h2>
    <h2>Edad: 18</h2>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <span>Pase</span>
      <div class="bar-container"><div class="bar-fill" data-value="81"></div></div>
      <span class="stat-number">0</span>
    </div>

    <div class="stat">
      <span>Tiro</span>
      <div class="bar-container"><div class="bar-fill" data-value="100"></div></div>
      <span class="stat-number">0</span>
    </div>

    <div class="stat">
      <span>Físico</span>
      <div class="bar-container"><div class="bar-fill" data-value="25"></div></div>
      <span class="stat-number">0</span>
    </div>

    <div class="stat">
      <span>Regate</span>
      <div class="bar-container"><div class="bar-fill" data-value="95"></div></div>
      <span class="stat-number">0</span>
    </div>

    <div class="stat">
      <span>Defensa</span>
      <div class="bar-container"><div class="bar-fill" data-value="68"></div></div>
      <span class="stat-number">0</span>
    </div>

    <div class="stat">
      <span>Velocidad</span>
      <div class="bar-container"><div class="bar-fill" data-value="102"></div></div>
      <span class="stat-number">0</span>
    </div>
  </div>

  <!-- COLUMNAS -->
  <div class="columns">

    <div class="column">
      <img src="reo.png">
      <h2>Reo Mikage U20</h2>
      <p>...TEXTO COMPLETO DE REO AQUÍ...</p>
    </div>

    <div class="column">
      <img src="isagi.png">
      <h2>Isagi Yoichi U20</h2>
      <p>...TEXTO COMPLETO DE ISAGI AQUÍ...</p>
    </div>

  </div>
</div>

<!-- SCRIPTS -->
<script>
/* PLUMAS */
for(let i=0;i<40;i++){
  let p=document.createElement("div");
  p.classList.add("pluma");
  p.style.width = p.style.height = (5 + Math.random()*18) + "px";
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (6 + Math.random()*8)+"s";
  document.body.appendChild(p);
}

/* AUDIO */
let audio=document.getElementById("anthem");
function playAudio(){
  if(audio.paused) audio.play();
  else audio.pause();
}

/* LOADING */
let progress=0;
let bar=document.getElementById("loadingProgress");
let screen=document.getElementById("loadingScreen");
let load=setInterval(()=>{
  progress+=Math.random()*6;
  if(progress>=100){
    progress=100;
    clearInterval(load);
    setTimeout(()=>screen.style.opacity="0",400);
    setTimeout(()=>screen.style.display="none",1000);
  }
  bar.style.width=progress+"%";
},100);

/* BARRAS */
function animateBars(){
  document.querySelectorAll(".stat").forEach(stat=>{
    const bar=stat.querySelector(".bar-fill");
    const num=stat.querySelector(".stat-number");
    const target=parseInt(bar.getAttribute("data-value"));
    let val=0;
    function frame(){
      if(val < target){
        val++;
        bar.style.width = val + "%";
        num.textContent = val;
        requestAnimationFrame(frame);
      }
    }
    requestAnimationFrame(frame);
  });
}
window.onload = animateBars;
</script>

</body>
</html>
